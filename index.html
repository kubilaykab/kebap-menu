<!DOCTYPE html>

<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kebap Menüsü</title>

  <script type="module"

    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">

  </script>

  <style>

    body {

      font-family: Arial, sans-serif;

      text-align: center;

      margin: 0;

      padding: 20px;

      background: #fffaf3;

    }

    h1 {

      color: #702d16;

    }

    model-viewer {

      width: 100%;

      height: 65vh;

      background: #f0e8dc;

      border-radius: 16px;

    }

    p {

      font-size: 17px;

    }

  </style>

</head>

<body>

  <h1>🍢 Kebap Menüsü</h1>

  <p>3D kebabını döndür veya masanda görüntüle!</p>

  <model-viewer

    src="24.10.2026.glb"

    alt="3 boyutlu kebap modeli"

    camera-controls

    auto-rotate

    ar

    ar-modes="quick-look scene-viewer webxr"

    shadow-intensity="1">

  </model-viewer>

</body>

</html>
